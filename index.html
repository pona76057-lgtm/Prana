<!DOCTYPE html>
<html lang="th">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prana Smart Farm</title>
    <script src="https://unpkg.com/react@18/umd/react.production.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

        document.getElementById('root').innerHTML = `

                <h1 style="color: #2e7d32; font-size: 28px;">🌱 Prana Smart Farm IoT</h1>

                    <p style="margin: 10px 0 0 0; font-size: 14px; color: #388e3c;">เชื่อมต่อกับเซิร์ฟเวอร์หลักเรียบร้อยแล้ว</p>
                </div>
            </div>
        `;
